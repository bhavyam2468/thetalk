name: Build & Package AppImage

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (Binary, Tests, Previews & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev file curl

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary & run self-test
        run: |
          cargo build --release
          ./target/release/thetalk --self-test

      - name: Render 2x HiDPI showcase previews
        run: |
          ./target/release/thetalk --render-preview assets/screenshots
          ls -lh assets/screenshots/*.png

      - name: Package portable AppImage
        run: |
          ./scripts/build-appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 ./releases/thetalk-x86_64.AppImage --self-test

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: thetalk-x86_64-AppImage
          path: |
            releases/thetalk-x86_64.AppImage
            releases/thetalk-x86_64.AppImage.sha256

      - name: Upload rendered UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: thetalk-showcase-screenshots
          path: assets/screenshots/*.png

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/thetalk-x86_64.AppImage
            releases/thetalk-x86_64.AppImage.sha256
